# Organization registry for deterministic artifact-ownership scoping.
#
# The registry NEVER alters artifact_evidence_level. It only scopes WHO owns an
# artifact so lead disposition can separate investable leads from established-org
# releases and third-party mentions. An org not present here is "unregistered"
# (never automatically a startup).
#
# entity_type: established_company | major_private_company | open_source_foundation
#              | accelerator_or_investor | other_non_target_organization
# registry_group: canary_observed | synthetic_boundary_test

organizations:
  # ---- A. CANARY-OBSERVED (exercise attribution against the saved fixture) ----
  - entity_name: Reuters
    entity_type: established_company
    registry_group: canary_observed
    domains: [reuters.com]
    github_owners: []
    aliases: [Reuters]

  - entity_name: Stripe
    entity_type: major_private_company
    registry_group: canary_observed
    domains: [stripe.com]
    github_owners: []
    aliases: [Stripe]

  - entity_name: Ramp
    entity_type: major_private_company
    registry_group: canary_observed
    domains: [ramp.com]
    github_owners: []
    aliases: [Ramp]

  - entity_name: Coinbase
    entity_type: established_company
    registry_group: canary_observed
    domains: [coinbase.com]
    github_owners: []
    aliases: [Coinbase]

  - entity_name: xAI
    entity_type: major_private_company
    registry_group: canary_observed
    domains: [x.ai]
    github_owners: []
    aliases: [xAI]

  - entity_name: Epic Games
    entity_type: established_company
    registry_group: canary_observed
    domains: [epicgames.com]
    github_owners: []
    aliases: [Epic, Epic Games]

  - entity_name: ByteDance
    entity_type: established_company
    registry_group: canary_observed
    domains: [bytedance.com]
    github_owners: []
    aliases: [ByteDance]

  - entity_name: Y Combinator
    entity_type: accelerator_or_investor
    registry_group: canary_observed
    domains: [ycombinator.com]
    github_owners: []
    aliases: [YC, Y Combinator]

  # ---- B. SYNTHETIC BOUNDARY-TEST (exact/subdomain/owner/substring behavior) --
  - entity_name: Microsoft
    entity_type: established_company
    registry_group: synthetic_boundary_test
    domains: [microsoft.com]
    github_owners: [microsoft]
    aliases: [Microsoft]

  - entity_name: Amazon Web Services
    entity_type: established_company
    registry_group: synthetic_boundary_test
    domains: [aws.amazon.com]
    github_owners: [aws]
    aliases: [AWS, Amazon Web Services]
